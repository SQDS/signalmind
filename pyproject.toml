[project]
name = "tsmcp"
version = "0.1.0"
description = "MCP server and library that lets LLMs analyze long time-series signals through handles, hierarchical views and exact measurements"
readme = "README.md"
license = "MIT"
authors = [
    { name = "coolittleshit", email = "2998334037@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "mcp>=2.2,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
processing = ["scipy>=1.11"]
cleaning = ["jsonschema>=4.26", "referencing>=0.37", "scipy>=1.11", "h5py>=3.15.1", "anthropic>=1.9.0", "pyyaml>=6"]
inspection = ["jsonschema>=4.26", "referencing>=0.37"]
workbench = ["jsonschema>=4.26", "referencing>=0.37", "starlette>=0.47", "uvicorn>=0.35", "python-multipart>=0.0.20", "scipy>=1.11", "h5py>=3.15.1", "anthropic>=1.9.0", "pyyaml>=6"]

[project.scripts]
tsmcp = "tsmcp:main"
tsmcp-clean = "tsmcp.cleaning.cli:main"
tsmcp-review-pattern = "tsmcp.followup.cli:main"
tsmcp-inspect = "tsmcp.inspection.run:main"
tsmcp-ui = "tsmcp.workbench.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "scipy>=1.11",
    "wfdb>=4.3.1",
]
eval = [
    "anthropic>=1.9.0",
    "h5py>=3.15.1",
    "wfdb>=4.3.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/tsmcp/cleaning/vendor", "src/tsmcp/locators/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"eval/**" = ["E501"]
"tests/**" = ["E501"]
