name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --group eval --extra cleaning --extra workbench
      - name: Run public offline review tests
        run: >-
          .venv/bin/python -m pytest -q tests/test_dataset_entry.py tests/test_processing.py
          tests/test_devkit_inspection.py tests/test_workbench.py tests/test_planned_quality.py
          tests/test_spike_repair_evidence.py -k "not skill_promotion_needs_sandbox_and_independent_paired_references"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
