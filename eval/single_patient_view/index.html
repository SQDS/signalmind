<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单患者 · 完整波形复查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:#1f3442;font:16px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:1.4rem}section{background:#fff;border:1px solid #dde3e5;padding:1rem 1.3rem;margin:1rem 0;border-radius:8px}h1,h2,h3,p{margin:.35em 0}h1{font-size:1.7rem}h2{font-size:1.2rem}h3{font-size:1.02rem}#map{display:block;max-width:100%;cursor:crosshair}select,button,input{font:inherit;max-width:100%}select,button{padding:.28rem .55rem;border:1px solid #becbd0;background:white;border-radius:4px}button{cursor:pointer}.row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:.6rem 0}label{font-size:14px}canvas{width:100%;height:125px;display:block;border-bottom:1px solid #ddd}#position{flex:1;min-width:120px}a{color:#126181}.legend,.muted,figcaption{font-size:14px;color:#476272}.dot{display:inline-block;width:13px;height:10px;margin-right:4px}.panel{padding:.65rem 0;border-bottom:1px solid #e1e7e9}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:.4rem;border-bottom:1px solid #dde4e6;white-space:nowrap}li{margin:.3rem 0}#hint,#status{min-height:1.5em;color:#5c6a70}details{margin:.5em 0}code{overflow-wrap:anywhere}input[type=checkbox]{vertical-align:middle}@media(max-width:620px){main{padding:.55rem}section{padding:.7rem}canvas{height:100px}.row{gap:.4rem}}</style></head>
<body><main><h1>一名患者的完整波形复查</h1><p id="lead"></p>
<section><h2>整份记录</h2><img id="map" src="overview.png" alt="ECG、PPG、ABP 按采集时间排列，分别标出程序触发、AI 圈选、数值改动与停用范围"><p class="muted">点击总览的波形区域，可定位到对应连续段。白色时间缺口保留原有长度；底部位置线为可见性加粗，实际持续时间请查看局部。</p><div id="hint" aria-live="polite"></div><div class="scroll"><table id="stats"></table></div></section>
<section id="detail"><h2>连续段与原始采样点</h2><div class="row"><button id="prev">上一段</button><label>段筛选 <select id="blockFilter"><option value="all">全部</option><option value="action">有数值改动或新增停用</option><option value="ai">有本次 AI 圈选</option><option value="rescan">有回扫命中</option></select></label><label>选择连续段 <select id="block"></select></label><button id="next">下一段</button></div>
<div class="row"><label>范围 <select id="span"><option value="block">整段</option><option value="5" selected>目标前后各 5 秒</option><option value="10">目标前后各 10 秒</option><option value="20">目标前后各 20 秒</option><option value="40">目标前后各 40 秒</option><option value=".35">目标前后各 0.35 秒</option></select></label><label>段内定位（中心秒数）</label><input id="position" type="range" min="0" value="0" step=".008"><output id="time"></output></div>
<div class="row"><label>定位到 <select id="kind"><option value="ai">本次 AI 圈选</option><option value="modified">数值改动</option><option value="excluded">新增停用</option><option value="rescan">回扫仍命中</option><option value="triggers">程序初筛</option></select></label><label>通道 <select id="task"><option>PPG</option><option>ECG</option><option>ABP</option></select></label><select id="event"></select></div>
<div class="legend"><span class="dot" style="background:#edb269"></span>程序触发　<span class="dot" style="background:#ffe4a9"></span>AI 疑似范围　<span class="dot" style="background:repeating-linear-gradient(135deg,#9aa3a6 0 1px,#fff 1px 4px)"></span>任务不可用　<span class="dot" style="background:#936bc4"></span>数值改动　<span class="dot" style="background:#ba4759"></span>回扫命中</div>
<div class="row"><label><input id="raw" type="checkbox" checked>原始值（蓝）</label><label><input id="out" type="checkbox" checked>交付值（绿虚线）</label><label><input id="trig" type="checkbox" checked>初筛标记</label></div><p id="status"></p>
<div id="waves"></div><p class="muted" id="hover">将鼠标移到波形上可查看精确采样值。</p><details><summary>本段改动依据与区间</summary><div id="ops"></div></details></section>
<section><h2>复查 Agent 实际查看的位置</h2><p><a id="compareLink" href="reviewed-event.png">打开代表疑点的三通道前后对比图</a></p><div id="reviews"></div><details><summary>各通道最终批次的自检记录和实际图片</summary><div id="batchReviews"></div></details></section>
<section><h2>首轮处理后的同类回扫</h2><p class="muted">每条方法单独计数。同一处可被多条方法命中。任务可用范围排除了已停用和估计值。</p><div class="scroll"><table id="sweeps"></table></div><p id="cost"></p></section></main><script src="viewer.js"></script><script src="data.js"></script></body></html>
